name: Deploy Ember to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', '.github/scripts/**', 'deployment.json', 'site-updates/**', 'site-updates-manifest.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify selected release
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,tarfile
          from pathlib import Path
          config=json.loads(Path('deployment.json').read_text())
          asset=config['asset']
          assert Path(asset).name==asset
          subprocess.run(['gh','release','download',config['release'],'--pattern',asset],check=True)
          assert hashlib.sha256(Path(asset).read_bytes()).hexdigest()==config['sha256'],'Release checksum mismatch'
          with tarfile.open(asset,'r:gz') as archive:
              archive.extractall('site',filter='data')
          files=[p for p in Path('site').rglob('*') if p.is_file()]
          assert len(files)==config['siteFileCount'],'File count mismatch'
          assert sum(p.stat().st_size for p in files)==config['siteBytes'],'Site size mismatch'
          assert Path('site/index.html').is_file() and Path('site/save-transfer.html').is_file()
          print('Verified',len(files),'site files')
          PY
      - name: Apply verified site updates
        run: python3 .github/scripts/apply-site-updates.py
      - name: Verify P0 startup, animation and save recovery
        run: EMBER_TEST_DIST=site node development/p0-save-recovery/p0.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

